name: Sweep
options:
  bundleIdPrefix: dev.algamthe
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  SweepCore:
    path: ..
settings:
  base:
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Sweep:
    type: application
    platform: macOS
    sources:
      - path: SweepApp
    info:
      path: SweepApp/Info.plist
      properties:
        CFBundleDisplayName: Sweep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 halalgami. MIT License."
        NSAppleEventsUsageDescription: Sweep asks Finder for the list of items in your Trash so it can find files left behind by deleted apps, and to empty the Trash when you ask.
        NSDocumentsFolderUsageDescription: Sweep looks in Documents for idle project build folders and large files. It never reads file contents.
        NSDesktopFolderUsageDescription: Sweep looks on the Desktop for idle project build folders. It never reads file contents.
        NSDownloadsFolderUsageDescription: Sweep looks in Downloads for old installers and large files. It never reads file contents.
    entitlements:
      path: SweepApp/Sweep.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    dependencies:
      - package: SweepCore
        product: SweepCore
      - target: SweepAgent
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.algamthe.sweep
        PRODUCT_NAME: Sweep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  SweepAgent:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/SweepAgent
    dependencies:
      - package: SweepCore
        product: SweepCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.algamthe.sweep.agent
        PRODUCT_NAME: SweepAgent
        OTHER_CODE_SIGN_FLAGS: "--identifier dev.algamthe.sweep.agent"
        SKIP_INSTALL: YES
schemes:
  Sweep:
    build:
      targets:
        Sweep: all
    run:
      config: Debug
